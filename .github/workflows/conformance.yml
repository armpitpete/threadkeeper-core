name: conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: false
      - name: Bootstrap pinned module metadata
        run: |
          go mod tidy
          echo '--- go.mod ---'
          cat go.mod
          echo '--- go.sum ---'
          cat go.sum
      - name: Test
        env:
          CGO_ENABLED: '0'
        run: go test ./...
      - name: Whole-tree race test
        run: go test -race ./...
      - name: Build CGO-free skeleton
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-X main.sourceCommit=${GITHUB_SHA} -X main.version=conformance" ./cmd/threadkeeper-core
      - name: Prove authority writes disabled
        run: |
          if ./threadkeeper-core authority-write; then
            echo "authority write unexpectedly enabled" >&2
            exit 1
          fi
      - name: Require committed module metadata
        run: git diff --exit-code -- go.mod go.sum

  windows-git-environment-isolation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: false
      - name: Prove case-insensitive Git environment isolation
        env:
          CGO_ENABLED: '0'
        run: go test ./internal/gitledger
